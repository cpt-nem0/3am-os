<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="400" fill="#120424" />
  
  <!-- Subtle Scanlines (3% Opacity) -->
  <pattern id="scanlines" width="100%" height="4" patternUnits="userSpaceOnUse">
    <rect width="100%" height="1" fill="#FFFFFF" fill-opacity="0.03" />
  </pattern>
  <rect width="1200" height="400" fill="url(#scanlines)" />

  <!-- Content Group (Centered) -->
  <g transform="translate(600, 200)">
    
    <!-- Wordmark Shadow -->
    <text x="4" y="4" text-anchor="middle" font-family="'Silkscreen', 'VT323', monospace" font-size="120" font-weight="bold" fill="#B399FF">3AM OS</text>
    
    <!-- Wordmark Main -->
    <text x="0" y="0" text-anchor="middle" font-family="'Silkscreen', 'VT323', monospace" font-size="120" font-weight="bold" fill="#FF85B3">3AM OS</text>

    <!-- Mascot: Mini Win95 Window (Navy blue title bar) -->
    <!-- Positioned to the right of the text -->
    <g transform="translate(260, -80)">
      <rect width="40" height="30" fill="#C0C0C0" stroke="#000000" stroke-width="2" />
      <rect width="40" height="8" fill="#000080" />
      <circle cx="34" cy="4" r="1.5" fill="#FFFFFF" />
      <circle cx="28" cy="4" r="1.5" fill="#FFFFFF" />
      <circle cx="22" cy="4" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- Mascot: Pixel Moon -->
    <!-- Positioned to the left above the text -->
    <g transform="translate(-320, -100)">
       <path d="M20 0 H30 V5 H35 V15 H40 V25 H35 V35 H30 V40 H20 V35 H15 V30 H10 V10 H15 V5 H20 V0 Z" fill="#EAEAEA" />
       <!-- Moon shape cutout -->
       <path d="M25 5 H30 V10 H35 V30 H30 V35 H25 V30 H20 V10 H25 V5 Z" fill="#120424" />
    </g>

    <!-- Tagline -->
    <text x="0" y="80" text-anchor="middle" font-family="'Space Mono', monospace" font-size="24" letter-spacing="4" fill="#EAEAEA">a hub for late-night internet surfers</text>
    
  </g>
</svg>